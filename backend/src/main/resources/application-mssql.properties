# ==========================================================
# TripMate Spring Boot 3.x - MSSQL Local Development Profile
# Activate with: --spring.profiles.active=mssql
# ==========================================================

# --- MSSQL Datasource Configuration ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tripmate_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}

# --- JPA / Hibernate Configuration (Schema controlled via Flyway) ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway Migration Configuration ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
