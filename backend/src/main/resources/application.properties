# ==========================================================
# TripMate Spring Boot 3.x Application Configuration
# Server Configuration (Dynamic port binding for Render/Cloud)
server.port=${PORT:8080}

# Spring Profiles: Default to postgres for cloud production environments
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# --- Default Datasource (PostgreSQL Cloud Compatible) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripmate_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Flyway Migration Configuration ---
# Disabled by default; schema is managed via Hibernate ddl-auto=update in PostgreSQL.
# For local MSSQL Flyway, activate the 'mssql' profile.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- JWT Security Settings ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.yourorg.appname=DEBUG
