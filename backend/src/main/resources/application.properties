# ==========================================================
# TripMate Spring Boot 3.x Application Configuration
# Server Configuration (Dynamic port binding for Render/Cloud)
server.port=${PORT:8080}

# Spring Profiles: Configurable via SPRING_PROFILES_ACTIVE with safe local default fallback
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local_default}

# --- MSSQL Datasource Configuration ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tripmate_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}

# --- JPA / Hibernate Configuration (Schema controlled via Flyway) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway Migration Configuration ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- JWT Security Settings ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.yourorg.appname=DEBUG
