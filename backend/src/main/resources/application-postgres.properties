# ==========================================================
# TripMate Spring Boot 3.x - PostgreSQL Production Profile
# ==========================================================

# --- PostgreSQL Datasource Configuration ---
# Note: If DATABASE_URL is provided by Render, DatabaseConfig.java
# will dynamically parse and configure the Hikari DataSource.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripmate_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# HikariCP Connection Pool Settings for Cloud Free/Starter Tiers
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate Configuration for PostgreSQL ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway Migrations ---
# Disable MSSQL T-SQL migration scripts when running against PostgreSQL.
# Hibernate ddl-auto=update manages the schema automatically for PostgreSQL.
spring.flyway.enabled=false
