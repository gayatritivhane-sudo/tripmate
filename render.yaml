databases:
  - name: tripmate-db
    databaseName: tripmate
    user: tripmate_user
    plan: free
    region: oregon

services:
  # ==========================================================
  # Backend Web Service: Spring Boot 3.x + Java 17 + PostgreSQL
  # ==========================================================
  - type: web
    name: tripmate-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/destinations
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://tripmate-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # ==========================================================
  # Frontend Static Site: React 18 + Vite + Tailwind CSS
  # Note: Static sites are served via Render's global CDN and
  # must not have a 'region' or 'plan' specified.
  # ==========================================================
  - type: web
    name: tripmate-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tripmate-backend.onrender.com
